name: PlatformIO CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install frontend build dependencies
        run: npm ci
      - name: Install PlatformIO
        run: pip install platformio
      - name: Validate project version
        run: python scripts/project_version.py
      - name: Build default environment
        run: pio run

  release-assets:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: esp32_notifier
            asset: esp32-notifier-${{ github.event.release.tag_name }}.bin
          - env: esp32_notifier_hacs
            asset: esp32-notifier-hacs-${{ github.event.release.tag_name }}.bin
          - env: esp32_notifier_hacs_slim
            asset: esp32-notifier-hacs-slim-${{ github.event.release.tag_name }}.bin
          - env: esp32s3_notifier
            asset: esp32s3-notifier-${{ github.event.release.tag_name }}.bin
          - env: esp32s3_notifier_hacs
            asset: esp32s3-notifier-hacs-${{ github.event.release.tag_name }}.bin
          - env: esp32s3_notifier_hacs_slim
            asset: esp32s3-notifier-hacs-slim-${{ github.event.release.tag_name }}.bin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install frontend build dependencies
        run: npm ci
      - name: Install PlatformIO
        run: pip install platformio
      - name: Validate release tag and firmware version
        run: python scripts/project_version.py --tag "${{ github.event.release.tag_name }}"
      - name: Build release firmware
        run: pio run -e ${{ matrix.env }}
      - name: Stage OTA asset
        run: |
          mkdir -p dist
          cp .pio/build/${{ matrix.env }}/firmware.bin dist/${{ matrix.asset }}
      - name: Upload OTA asset to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset }}

  release-flasher:
    if: github.event_name == 'release'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install frontend and firmware build dependencies
        run: |
          npm ci
          python -m pip install platformio
      - name: Validate release tag and application versions
        run: python scripts/project_version.py --tag "${{ github.event.release.tag_name }}"
      - name: Build embedded ESP32 support images
        run: pio run -e esp32_notifier -e esp32s3_notifier
      - name: Build portable ELMA Flasher
        shell: powershell
        run: .\scripts\build_elma_flasher.ps1
      - name: Validate packaged ELMA Flasher
        shell: powershell
        run: |
          $process = Start-Process -FilePath ".\release-assets\${{ github.event.release.tag_name }}\ELMA-Flasher-${{ github.event.release.tag_name }}.exe" -ArgumentList '--self-test' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "ELMA Flasher self-test failed with exit code $($process.ExitCode)." }
      - name: Upload ELMA Flasher to release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/${{ github.event.release.tag_name }}/ELMA-Flasher-${{ github.event.release.tag_name }}.exe
